name: backend-ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: lint + typecheck + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Phase 11: dependency hygiene.
      # `audit-level=critical` is the hard gate — anything CRITICAL fails the
      # build. The advisory step right below logs high+moderate findings
      # without blocking (the NestJS 10 line ships transitive `multer` highs
      # that only unwind on a NestJS 11 bump tracked separately).
      - name: npm audit — runtime deps (CRITICAL gate)
        run: npm audit --omit=dev --audit-level=critical
      - name: npm audit — runtime deps (advisory, high+)
        run: npm audit --omit=dev --audit-level=high || true
